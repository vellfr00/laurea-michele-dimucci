<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auguri Mchel Di Mu</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      width: 100%;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top, #1d4ed8 0%, #0f172a 65%, #020617 100%);
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      z-index: 10;
    }

    .badge {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      background: #ef4444;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 999px;
    }

    .audio-btn {
      display: none;
      background: #f59e0b;
      color: #111827;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 800;
      cursor: pointer;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px 28px;
      position: relative;
    }

    .stage {
      position: relative;
      width: min(92vw, 960px);
      height: min(74vh, 680px);
      border-radius: 20px;
      overflow: hidden;
      border: 4px solid #f59e0b;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .placeholder {
      text-align: center;
      padding: 24px;
    }

    .placeholder-title {
      font-size: 1.4rem;
      font-weight: 900;
      margin: 0 0 8px;
      color: #fbbf24;
    }

    .placeholder-text {
      color: #cbd5e1;
      margin: 0;
    }

    @keyframes scorriDavanti {
      0% {
        transform: translate3d(105vw, -50%, 0) rotate(-2deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translate3d(-120%, -50%, 0) rotate(-2deg);
        opacity: 0;
      }
    }

    .frase-scorrimento {
      position: absolute;
      top: 50%;
      left: 0;
      white-space: nowrap;
      font-weight: 900;
      font-size: clamp(1.3rem, 3.6vw, 2.8rem);
      letter-spacing: 0.04em;
      color: #fff3b0;
      background: rgba(15, 23, 42, 0.86);
      border: 3px solid #f59e0b;
      border-radius: 12px;
      padding: 10px 22px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
      pointer-events: none;
      z-index: 5;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
    }

    .modal {
      max-width: 440px;
      width: 100%;
      background: #0f172a;
      border: 2px solid #f59e0b;
      border-radius: 18px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .modal-title {
      margin: 0 0 10px;
      font-size: 1.5rem;
      font-weight: 900;
      color: #fbbf24;
    }

    .modal-text {
      margin: 0 0 20px;
      color: #e2e8f0;
      line-height: 1.5;
    }

    .start-btn {
      background: #ef4444;
      color: #ffffff;
      border: 2px solid #fbbf24;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <audio id="sigla-audio" src="sigla.mp3" autoplay loop preload="auto"></audio>

  <header>
    <span class="badge">UAN PIS SPECIAL EDITION</span>
    <button type="button" id="audio-btn" class="audio-btn">Pausa sigla</button>
  </header>

  <main>
    <div class="stage" id="stage">
      <img id="foto-amico" alt="Dottore Una Pis" />
      <div class="placeholder" id="placeholder">
        <p class="placeholder-title">IMMAGINE CENTRALE GRANDE</p>
        <p class="placeholder-text">
          Imposta <code>immagineUrl</code> in <code>CONFIG</code> dentro questo file HTML con la foto del tuo amico
        </p>
      </div>
    </div>
  </main>

  <script>
    const CONFIG = {
      // Metti il percorso o URL della foto (es. "./amico.jpg") oppure lascia null per il placeholder
      immagineUrl: "foto.png",
      // Frasi che scorrono davanti all'immagine ogni tanto
      frasiScorrevoli: [
        "UANPIS UANPIS UNAPIS",
        "DOTTORE!",
        "AUGURI MCHEL DI MU!",
        "UANPISUANPISUNAPISUANPISUANPISUNAPIS",
        "TECNICO DI LABORATORIO"
      ],
      // Intervallo in millisecondi tra una scritta e la successiva
      intervalloFrasiMs: 3600
    };

    const audioEl = document.getElementById("sigla-audio");
    const audioBtn = document.getElementById("audio-btn");
    const startBtn = document.getElementById("start-btn");
    const stage = document.getElementById("stage");
    const fotoEl = document.getElementById("foto-amico");
    const placeholderEl = document.getElementById("placeholder");

    if (CONFIG.immagineUrl) {
      fotoEl.src = CONFIG.immagineUrl;
      fotoEl.style.display = "block";
      placeholderEl.style.display = "none";
    }

    let indiceFrase = 0;

    function mostraFraseScorrevole() {
      const vecchiaFrase = stage.querySelector(".frase-scorrimento");
      if (vecchiaFrase) vecchiaFrase.remove();

      const el = document.createElement("div");
      el.className = "frase-scorrimento";
      el.textContent = CONFIG.frasiScorrevoli[indiceFrase];
      const durataSec = Math.max(2.6, CONFIG.intervalloFrasiMs / 1000);
      el.style.animation = `scorriDavanti ${durataSec}s linear forwards`;

      stage.appendChild(el);
      indiceFrase = (indiceFrase + 1) % CONFIG.frasiScorrevoli.length;
    }

    window.addEventListener("DOMContentLoaded", async () => {
      console.log("Window loaded");
      audioBtn.style.display = "none";

      try {
        await audioEl.play();
        audioBtn.textContent = "Pausa sigla";
      } catch(e) {
        audioBtn.textContent = "Riavvia sigla";
        console.error(e);
      }

      mostraFraseScorrevole();
      setInterval(mostraFraseScorrevole, CONFIG.intervalloFrasiMs);
    });

    audioBtn.addEventListener("click", async () => {
      if (audioEl.paused) {
        try {
          await audioEl.play();
          audioBtn.textContent = "Pausa sigla";
        } catch {
          audioBtn.textContent = "Riavvia sigla";
        }
      } else {
        audioEl.pause();
        audioBtn.textContent = "Riavvia sigla";
      }
    });
  </script>
</body>
</html>
